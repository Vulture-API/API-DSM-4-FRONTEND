# ---------------------------------------------------------------------------
# SCRUM-377 — Pipeline de Integração Contínua (Equipe Vulture)
#
# Arquivo ÚNICO para todos os repositórios Node/TypeScript do projeto.
# Copie como está; só ajuste APP_DIR se o package.json não estiver na raiz
# (ex.: frontend, APP_DIR: app). Cada etapa se adapta ao que o repo tem:
# scripts ausentes viram aviso, e o Docker só roda se existir Dockerfile.
#
# Etapas (documento "Integração Contínua CI" do Confluence):
#   Instalação clean room -> Auditoria -> Lint -> Formatação -> Tipos
#   -> Testes (unitários + integração com Postgres) -> Quality Gate 80% -> Build
# ---------------------------------------------------------------------------
name: CI

# A suíte completa roda no PR para a dev: é a pipeline da feature. No push da
# dev, o job de procedência confere que entrou o mesmo conteúdo testado no PR e,
# confirmado, não repete a suíte; sem prova, roda tudo. A main não tem gatilho:
# a promoção usa o que ficou registrado no commit da dev.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

# Em PR, commit novo cancela a execução antiga; na dev, cada merge tem a sua.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Somente leitura por padrão. Só o job "comment" (que não executa código do PR)
# recebe permissão de escrever no Pull Request.
permissions:
  contents: read

env:
  NODE_VERSION: "24"
  COVERAGE_THRESHOLD: "80"
  APP_DIR: "app"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  procedencia:
    name: Procedência do commit na dev
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      testado: ${{ steps.conferir.outputs.testado }}
    steps:
      - name: Conferir se o conteúdo já foi testado no PR
        id: conferir
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            const roda = (motivo) => {
              core.notice(`Suíte completa nesta execução: ${motivo}.`);
              core.setOutput('testado', 'false');
            };
            try {
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: sha });
              if (commit.parents.length !== 2) return roda('o commit não é o merge de um PR');
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
              const pr = prs.find((p) => p.merged_at && p.merge_commit_sha === sha);
              if (!pr) return roda('nenhum PR mesclado gerou este commit');
              const head = pr.head.sha;
              const [{ data: merge }, { data: testado }] = await Promise.all([
                github.rest.git.getCommit({ ...context.repo, commit_sha: sha }),
                github.rest.git.getCommit({ ...context.repo, commit_sha: head }),
              ]);
              if (merge.tree.sha !== testado.tree.sha) return roda(`o conteúdo da dev difere do commit testado no PR #${pr.number}`);
              const { data: comparacao } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${commit.parents[0].sha}...${head}`,
              });
              if (!['ahead', 'identical'].includes(comparacao.status)) return roda(`o PR #${pr.number} não estava atualizado com a dev`);
              const workflow = process.env.GITHUB_WORKFLOW_REF.split('@')[0].split('/').pop();
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflow,
                head_sha: head,
                event: 'pull_request',
                status: 'success',
                per_page: 1,
              });
              const run = runs.workflow_runs[0];
              if (!run) return roda(`não há CI verde no commit ${head.slice(0, 7)} do PR #${pr.number}`);
              core.setOutput('testado', 'true');
              await core.summary
                .addHeading('Procedência confirmada', 3)
                .addRaw(`O commit ${sha.slice(0, 7)} da dev tem o mesmo conteúdo do commit ${head.slice(0, 7)}, testado no PR #${pr.number}. `)
                .addRaw('A suíte do repositório não roda de novo.')
                .addBreak()
                .addLink('Execução que testou este conteúdo', run.html_url)
                .write();
            } catch (erro) {
              roda(`não foi possível conferir (${erro.message})`);
            }

  quality:
    needs: procedencia
    # Roda no PR e em execução manual; no push da dev, só se a procedência não
    # provar que este conteúdo já passou no PR.
    if: ${{ !cancelled() && needs.procedencia.outputs.testado != 'true' }}
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage_gate.outputs.coverage }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Instalar dependências (clean room)
        run: npm ci

      - name: Auditoria de vulnerabilidades críticas
        run: npm audit --audit-level=critical

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::warning::Sem script 'lint' no package.json — etapa pulada. Configure o ESLint para cumprir a DoD."
          fi

      - name: Checagem de formatação
        run: |
          if node -e "process.exit(require('./package.json').scripts?.format ? 0 : 1)"; then
            npm run format
          else
            echo "::warning::Sem script 'format' no package.json — etapa pulada. Configure o Prettier para cumprir a DoD."
          fi

      - name: Checagem de tipos
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            # Next.js gera tipos de rota (ex.: LayoutProps) antes do tsc.
            if [ -x node_modules/.bin/next ]; then npx next typegen; fi
            npx tsc --noEmit
          fi

      # Cada nível roda uma vez e guarda a sua cobertura; o passo de cobertura
      # só junta os dois relatórios e cobra os 80%, sem rodar os testes de novo.
      - name: Testes unitários
        env:
          COBERTURA_PARCIAL: "1"
        run: npm run test:ci:unit

      - name: Testes de integração (telas)
        env:
          COBERTURA_PARCIAL: "1"
        run: npm run test:ci:int

      - name: Cobertura total dos dois níveis
        run: npm run test:ci:coverage

      - name: Quality Gate de cobertura (DoD 80%)
        id: coverage_gate
        run: |
          SUMMARY="coverage/coverage-summary.json"

          if [ ! -f "$SUMMARY" ]; then
            echo "::error::Relatório de cobertura não encontrado em $SUMMARY."
            exit 1
          fi

          COVERAGE=$(node -p "Math.floor(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Cobertura de linhas: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

          if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "::error::FALHA: cobertura de ${COVERAGE}% não atinge a DoD (${COVERAGE_THRESHOLD}%). Merge bloqueado."
            exit 1
          fi

          echo "::notice::Quality Gate aprovado: ${COVERAGE}% de cobertura."

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::warning::Sem script 'build' — etapa pulada."
          fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ${{ env.APP_DIR }}/coverage/
          retention-days: 30
          if-no-files-found: ignore

  docker:
    name: Validar build da imagem Docker
    runs-on: ubuntu-24.04
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build da imagem (sem push)
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          if [ ! -f "$APP_DIR/Dockerfile" ]; then
            echo "::notice::Sem Dockerfile em $APP_DIR — etapa pulada."
            exit 0
          fi
          # O Docker exige tag em minúsculas; o nome do repositório tem maiúsculas.
          IMAGE="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE:ci-$SHA" "$APP_DIR"

  # Comentário com o resultado no PR. Job separado: é o único com permissão de
  # escrita e não executa nenhum código vindo do PR.
  comment:
    name: Comentar resultado no PR
    runs-on: ubuntu-24.04
    needs: [quality, docker]
    # PRs de fork recebem token só de leitura: nesses, o comentário é pulado.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Criar ou atualizar o comentário do CI
        # O comentário é informativo: nunca derruba o pipeline.
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
          COVERAGE: ${{ needs.quality.outputs.coverage }}
        with:
          script: |
            const marker = '<!-- vulture-ci-report -->';
            const ok = process.env.QUALITY === 'success' && ['success', 'skipped'].includes(process.env.DOCKER);
            const coverage = process.env.COVERAGE || 'n/d';
            const body = [
              marker,
              `${ok ? '✅' : '❌'} **Pipeline de CI: ${ok ? 'aprovado' : 'reprovado'}**`,
              '',
              `- Lint, testes e build: \`${process.env.QUALITY}\``,
              `- Imagem Docker: \`${process.env.DOCKER}\``,
              `- Cobertura de linhas: **${coverage}%** (mínimo ${process.env.COVERAGE_THRESHOLD}%)`,
              `- Commit: \`${context.sha.substring(0, 7)}\``,
              `- [Ver execução completa](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            // Um comentário só por PR, atualizado a cada execução.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
